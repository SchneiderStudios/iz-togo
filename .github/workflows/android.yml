name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: iz-togo-chto-est-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk iz-togo.apk
      - name: Publish to Releases (latest build)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: "Установить на Android: скачайте iz-togo.apk и откройте файл на телефоне."
          files: iz-togo.apk
          make_latest: true
